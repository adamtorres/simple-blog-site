{% load static %}
<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Simple Blog{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'blog:home' %}">Simple Blog</a>
            <div class="navbar-nav ms-auto">
                {% if request.session.viewer_id %}
                    <a class="nav-link" href="{% url 'blog:post_list' %}">All Posts</a>
                    <span class="nav-link text-muted">Welcome, {{ request.session.viewer_id }}</span>
                    <a class="nav-link" href="{% url 'blog:viewer_logout' %}">Logout</a>
                {% else %}
                    <a class="nav-link" href="{% url 'blog:home' %}">Login</a>
                {% endif %}
                {% if is_staff %}
                    <a class="nav-link" href="/admin/blog/post/add/">Create a Post</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center text-muted mt-5 py-4 border-top">
        <small>Simple Blog &copy; 2026</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
