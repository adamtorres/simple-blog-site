<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2048 Game</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #faf8ef; color: #776e65;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh; padding: 16px; user-select: none; -webkit-user-select: none;
  }
  .game-wrapper { display: flex; flex-direction: column; align-items: center; gap: 12px; max-width: 480px; width: 100%; }
  .title-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
  .game-title { font-size: 48px; font-weight: 800; color: #776e65; }
  .game-title span { color: #edc22e; }
  .scoreboard { display: flex; gap: 8px; width: 100%; justify-content: space-between; }
  .score-box { background: #bbada0; border-radius: 6px; padding: 8px 16px; text-align: center; flex: 1; min-width: 0; position: relative; overflow: hidden; }
  .score-box-label { font-size: 11px; font-weight: 700; text-transform: uppercase; color: #eee4da; letter-spacing: 1px; }
  .score-box-value { font-size: 22px; font-weight: 800; color: #fff; position: relative; display: inline-block; min-width: 20px; transition: transform 0.15s ease; }
  .score-box-value.rolling { transform: translateY(-3px); }
  .score-box.highlight .score-box-value { animation: scorePop 0.3s ease; }
  .high-box { background: #8f7a66; }
  .ppm-box { background: #f2b179; }
  .controls { display: flex; gap: 8px; width: 100%; justify-content: center; flex-wrap: wrap; }
  .btn { border: none; border-radius: 6px; padding: 10px 20px; font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.2s, transform 0.1s; color: #fff; background: #8f7a66; }
  .btn:hover { filter: brightness(1.1); } .btn:active { transform: scale(0.96); }
  .btn.muted { background: #ccc; }
  .btn.primary { background: #edc22e; color: #776e65; }
  .board-container { position: relative; width: 100%; aspect-ratio: 1; background: #bbada0; border-radius: 8px; padding: 8px; touch-action: none; }
  .board-bg { display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); gap: 8px; width: 100%; height: 100%; }
  .cell { background: rgba(238,228,218,0.35); border-radius: 4px; }
  .tile-container { position: absolute; inset: 8px; pointer-events: none; }
  .tile { position: absolute; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-weight: 800; transition: top 0.12s ease, left 0.12s ease; z-index: 1; }
  .tile-new { animation: tileAppear 0.2s ease; animation-fill-mode: backwards; }
  .tile-merged { animation: tileMerge 0.2s ease; z-index: 2; }
  .overlay { position: absolute; inset: 0; background: rgba(238,228,218,0.73); border-radius: 8px; display: none; justify-content: center; align-items: center; flex-direction: column; gap: 16px; z-index: 100; }
  .overlay.active { display: flex; }
  .overlay h2 { font-size: 36px; font-weight: 800; color: #776e65; }
  .overlay .btn { padding: 14px 32px; font-size: 16px; }
  .paused-text { position: absolute; inset: 0; display: none; justify-content: center; align-items: center; background: rgba(238,228,218,0.55); border-radius: 8px; z-index: 50; }
  .paused-text.active { display: flex; }
  .paused-text h2 { font-size: 42px; color: #776e65; font-weight: 800; }
  .timer { font-size: 14px; font-weight: 600; color: #776e65; margin-top: 2px; }
  @keyframes tileAppear { 0% { transform: scale(0); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes tileMerge { 0% { transform: scale(1); } 40% { transform: scale(1.2); } 100% { transform: scale(1); } }
  @keyframes scorePop { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
  @media (max-width: 500px) {
    .game-title { font-size: 36px; }
    .score-box { padding: 6px 8px; }
    .score-box-value { font-size: 18px; }
    .score-box-label { font-size: 10px; }
    .btn { padding: 8px 14px; font-size: 12px; }
  }
</style>
</head>
<body>
<div class="game-wrapper">
  <div class="title-row"><div class="game-title">2048</div><div class="timer" id="timer">00:00</div></div>
  <div class="scoreboard">
    <div class="score-box" id="scoreBox"><div class="score-box-label">Score</div><div class="score-box-value" id="score">0</div></div>
    <div class="score-box high-box" id="highBox"><div class="score-box-label">Best</div><div class="score-box-value" id="highScore">0</div></div>
    <div class="score-box ppm-box"><div class="score-box-label">PPM</div><div class="score-box-value" id="ppm">0.0</div></div>
  </div>
  <div class="controls">
    <button class="btn primary" id="btnNewGame">New Game</button>
    <button class="btn" id="btnPause">Pause</button>
    <button class="btn" id="btnMute">&#x1F50A;</button>
  </div>
  <div class="board-container" id="boardContainer">
    <div class="board-bg">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
    </div>
    <div class="tile-container" id="tileContainer"></div>
    <div class="overlay" id="overlay"><h2 id="overlayMsg">Game Over!</h2><button class="btn primary" id="btnOverlayNew">Play Again</button></div>
    <div class="paused-text" id="pausedText"><h2>PAUSED</h2></div>
  </div>
</div>

<script>
// ===================== CONSTANTS =====================
const SIZE = 4;
const TILE_COLORS = {
  2:{bg:'#eee4da',color:'#776e65',fs:0.55}, 4:{bg:'#ede0c8',color:'#776e65',fs:0.55},
  8:{bg:'#f2b179',color:'#f9f6f2',fs:0.55}, 16:{bg:'#f59563',color:'#f9f6f2',fs:0.50},
  32:{bg:'#f67c5f',color:'#f9f6f2',fs:0.50}, 64:{bg:'#f65e3b',color:'#f9f6f2',fs:0.50},
  128:{bg:'#edcf72',color:'#f9f6f2',fs:0.45}, 256:{bg:'#edcc61',color:'#f9f6f2',fs:0.45},
  512:{bg:'#edc850',color:'#f9f6f2',fs:0.45}, 1024:{bg:'#edc53f',color:'#f9f6f2',fs:0.40},
  2048:{bg:'#edc22e',color:'#f9f6f2',fs:0.40},
};

// ===================== STATE =====================
let grid=[], score=0, bestScore=0, highPPM=0;
let gameTime=0, gameTimer=null, paused=false, soundOn=true;
let gameOver=false, gameWon=false, mergedTiles=new Set(), animating=false;

// ===================== DOM =====================
const $score=document.getElementById('score'), $highScore=document.getElementById('highScore');
const $ppm=document.getElementById('ppm'), $timer=document.getElementById('timer');
const $tileContainer=document.getElementById('tileContainer');
const $boardContainer=document.getElementById('boardContainer');
const $overlay=document.getElementById('overlay'), $overlayMsg=document.getElementById('overlayMsg');
const $pausedText=document.getElementById('pausedText');
const $scoreBox=document.getElementById('scoreBox');
const $btnPause=document.getElementById('btnPause'), $btnMute=document.getElementById('btnMute');
const $btnNew=document.getElementById('btnNewGame'), $btnOverlay=document.getElementById('btnOverlayNew');

// ===================== COOKIE HELPERS =====================
function setCookie(name,val,days){const d=new Date(Date.now()+days*86400000);document.cookie=name+'='+encodeURIComponent(val)+';expires='+d.toUTCString()+';path=/';}
function getCookie(name){const m=document.cookie.match(new RegExp('(^| )'+name+'=([^;]+)'));return m?decodeURIComponent(m[2]):null;}

// ===================== AUDIO =====================
let audioCtx=null;
function getAudioCtx(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();return audioCtx;}
function playTone(freq,duration,vol,type){if(!soundOn)return;try{const ctx=getAudioCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.type=type||'sine';osc.frequency.setValueAtTime(freq,ctx.currentTime);gain.gain.setValueAtTime(vol||0.08,ctx.currentTime);gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+duration);osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+duration);}catch(e){}}
function sndSlide(){playTone(120,0.08,0.04);}
function sndMerge(){playTone(400,0.15,0.08,'triangle');playTone(600,0.12,0.06,'sine');}
function sndSpawn(){playTone(800,0.05,0.03,'sine');}
function sndGameOver(){playTone(200,0.3,0.06,'sawtooth');setTimeout(()=>playTone(150,0.4,0.05,'sawtooth'),200);}
function sndWin(){[300,400,500,600,800].forEach((f,i)=>setTimeout(()=>playTone(f,0.15,0.06,'sine'),i*80));}

// ===================== SCORE ANIMATION =====================
let rollingTimeout=null;
function animateScore($el,from,to,cls){
  cancelAnimationFrame($el._raf);
  if(rollingTimeout)clearTimeout(rollingTimeout);
  rollingTimeout=setTimeout(()=>$el.classList.remove('rolling'),200);
  const step=to>from?1:-1, dur=Math.min(250,Math.max(100,Math.abs(to-from)*3)), start=performance.now();
  $el.classList.add(cls||'rolling');
  const tick=(now)=>{const elapsed=now-start, progress=Math.min(elapsed/dur,1);const eased=1-Math.pow(1-progress,3);const val=Math.round(from+(to-from)*eased);$el.textContent=val;if(progress<1)$el._raf=requestAnimationFrame(tick);else{$el.classList.remove(cls||'rolling');}};
  $el._raf=requestAnimationFrame(tick);
}
function updateScore(newScore){
  const diff=newScore-score; score=newScore;
  if(Math.abs(diff)>0)animateScore($score,score-diff,score);
  else $score.textContent=score;
  $scoreBox.classList.remove('highlight');void $scoreBox.offsetWidth;$scoreBox.classList.add('highlight');
  updatePPM();
}
function updatePPM(){if(gameTime<=0){$ppm.textContent='0.0';return;}const mins=gameTime/60;$ppm.textContent=(score/mins).toFixed(1);}

// ===================== TIMER =====================
function startTimer(){if(gameTimer)clearInterval(gameTimer);gameTimer=setInterval(()=>{if(!paused&&!gameOver){gameTime++;$timer.textContent=formatTime(gameTime);updatePPM();}},1000);}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function stopTimer(){if(gameTimer){clearInterval(gameTimer);gameTimer=null;}}

// ===================== GRID HELPERS =====================
function createTile(value,r,c){return{value,r,c,id:Math.random().toString(36).substr(2,9),isNew:true,merging:false};}
function emptyGrid(){const g=[];for(let r=0;r<SIZE;r++){g[r]=[];for(let c=0;c<SIZE;c++)g[r][c]=null;}return g;}
function emptyCells(){const cells=[];for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])cells.push({r,c});return cells;}
function randomEmptyCell(){const cells=emptyCells();if(cells.length===0)return null;return cells[Math.floor(Math.random()*cells.length)];}
function addRandomTile(){const cell=randomEmptyCell();if(!cell)return null;const tile=createTile(Math.random()<0.9?2:4,cell.r,cell.c);grid[cell.r][cell.c]=tile;return tile;}

// ===================== MOVE LOGIC =====================
function move(dir){
  if(paused||gameOver||gameWon)return;
  const rotated=rotateGrid(grid,dir);
  let moved=false, mergeScore=0; mergedTiles.clear();
  for(let r=0;r<SIZE;r++){
    const row=rotated[r].filter(t=>t!==null), merged=[];
    for(let i=0;i<row.length;i++){
      if(i+1<row.length&&row[i].value===row[i+1].value){
        const newVal=row[i].value*2;
        merged.push(createTile(newVal,r,merged.length));
        merged[merged.length-1].merging=true;
        mergeScore+=newVal; i++;
      }else merged.push(row[i]);
    }
    while(merged.length<SIZE)merged.push(null);
    for(let c=0;c<SIZE;c++){if(rotated[r][c]!==merged[c])moved=true;rotated[r][c]=merged[c];}
  }
  if(!moved)return;
  grid=rotateGrid(rotated,(4-dir)%4);
  updateScore(score+mergeScore);
  const newTile=addRandomTile(); if(newTile)sndSpawn();
  if(mergeScore>0)sndMerge();else sndSlide();
  renderBoard();
  if(!gameWon&&checkWin()){gameWon=true;sndWin();showOverlay('You Win!');saveHighScores();return;}
  if(checkLose()){gameOver=true;stopTimer();sndGameOver();showOverlay('Game Over');saveHighScores();return;}
}
function rotateGrid(g,times){
  let out=g.map(row=>row.slice());
  for(let t=0;t<times;t++){const n=SIZE,rotated=Array.from({length:n},()=>Array(n).fill(null));for(let r=0;r<n;r++)for(let c=0;c<n;c++)rotated[c][n-1-r]=out[r][c];out=rotated;}
  return out;
}
function checkWin(){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(grid[r][c]&&grid[r][c].value>=2048)return true;return false;}
function checkLose(){for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){if(!grid[r][c])return false;const v=grid[r][c].value;if(c+1<SIZE&&grid[r][c+1]&&grid[r][c+1].value===v)return false;if(r+1<SIZE&&grid[r+1][c]&&grid[r+1][c].value===v)return false;}return true;}

// ===================== RENDERING =====================
function getTileSize(){return ($boardContainer.clientWidth - 16 - (SIZE-1)*8) / SIZE;}
function getTilePos(r,c){return{top:r*(getTileSize()+8),left:c*(getTileSize()+8)};}
function getTileStyle(tile){
  const pos=getTilePos(tile.r,tile.c), sz=getTileSize();
  const info=TILE_COLORS[tile.value]||{bg:'#3c3a32',color:'#f9f6f2',fs:0.35};
  const fs=Math.round(sz*info.fs);
  return{width:sz-4,height:sz-4,top:pos.top+2,left:pos.left+2,fontSize:fs+'px',backgroundColor:info.bg,color:info.color};
}
function renderBoard(){
  const sz = getTileSize();
  $tileContainer.innerHTML = '';
  for(let r = 0; r < SIZE; r++){
    for(let c = 0; c < SIZE; c++){
      const tile = grid[r][c];
      if(!tile) continue;
      const el = document.createElement('div');
      el.className = 'tile';
      if(tile.isNew){ el.classList.add('tile-new'); tile.isNew = false; }
      if(tile.merging){ el.classList.add('tile-merged'); tile.merging = false; }

      const top  = r * (sz + 8) + 2;
      const left = c * (sz + 8) + 2;
      const info = TILE_COLORS[tile.value] || {bg:'#3c3a32',color:'#f9f6f2',fs:0.35};
      const fs = Math.round(sz * info.fs);

      el.style.width    = (sz - 4) + 'px';
      el.style.height   = (sz - 4) + 'px';
      el.style.top      = top + 'px';
      el.style.left     = left + 'px';
      el.style.fontSize = fs + 'px';
      el.style.backgroundColor = info.bg;
      el.style.color = info.color;

      el.textContent = tile.value;
      $tileContainer.appendChild(el);
    }
  }
}

// ===================== OVERLAY =====================
function showOverlay(msg){$overlayMsg.textContent=msg;$overlay.classList.add('active');}
function hideOverlay(){$overlay.classList.remove('active');}

// ===================== HIGH SCORE =====================
function loadHighScores(){
  bestScore=parseInt(getCookie('2048_best'))||0;
  highPPM=parseFloat(getCookie('2048_bestppm'))||0;
  $highScore.textContent=bestScore;
  $ppm.textContent=highPPM>0?highPPM.toFixed(1):'0.0';
}
function saveHighScores(){
  if(score>bestScore){bestScore=score;$highScore.textContent=bestScore;setCookie('2048_best',bestScore,365);}
  if(gameTime>0){const ppm=score/(gameTime/60);if(ppm>highPPM){highPPM=ppm;$ppm.textContent=highPPM.toFixed(1);setCookie('2048_bestppm',highPPM,365);}}
}

// ===================== GAME INIT =====================
function startNewGame(){
  stopTimer(); $overlay.classList.remove('active'); $pausedText.classList.remove('active');
  grid=emptyGrid(); score=0; gameTime=0; gameOver=false; gameWon=false; paused=false; animating=false;
  $score.textContent='0'; $timer.textContent='00:00'; $btnPause.textContent='Pause';
  addRandomTile(); addRandomTile(); renderBoard(); startTimer();
}
function togglePause(){
  if(gameOver)return; paused=!paused;
  $pausedText.classList.toggle('active',paused); $btnPause.textContent=paused?'Resume':'Pause';
}
function toggleSound(){
  soundOn=!soundOn; $btnMute.textContent=soundOn?'🔊':'🔇';
  $btnMute.classList.toggle('muted',!soundOn);
}

// ===================== INPUT: KEYBOARD =====================
document.addEventListener('keydown',(e)=>{
  if(gameOver||paused)return;
  const map={ArrowLeft:0,ArrowUp:3,ArrowRight:2,ArrowDown:1,a:0,w:3,d:2,s:1};
  if(map[e.key]!==undefined){e.preventDefault();animating=true;move(map[e.key]);setTimeout(()=>{animating=false;},130);}
});

// ===================== INPUT: TOUCH =====================
let touchStartX=0,touchStartY=0;
board=$boardContainer;
board.addEventListener('touchstart',(e)=>{if(e.touches.length===1){touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY;}},{passive:true});
board.addEventListener('touchend',(e)=>{
  if(gameOver||paused)return;
  const dx=e.changedTouches[0].clientX-touchStartX, dy=e.changedTouches[0].clientY-touchStartY;
  const absDx=Math.abs(dx),absDy=Math.abs(dy);
  if(Math.max(absDx,absDy)<30)return;
  animating=true;
  if(absDx>absDy)move(dx>0?2:0);else move(dy>0?1:3);
  setTimeout(()=>{animating=false;},130);
},{passive:true});

// ===================== BUTTON HANDLERS =====================
$btnNew.addEventListener('click',startNewGame);
$btnOverlay.addEventListener('click',startNewGame);
$btnPause.addEventListener('click',togglePause);
$btnMute.addEventListener('click',toggleSound);

// ===================== RESIZE =====================
window.addEventListener('resize',()=>renderBoard());

// ===================== START =====================
loadHighScores();
startNewGame();
</script>
</body>
</html>
